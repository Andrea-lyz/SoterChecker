<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SoterChecker 判词</title>
<script>
/* theme is a software-layer choice kept in the page, never the system dark mode */
(function () {
  var t = "light";
  try { t = localStorage.getItem("sotercheck-theme") || "light"; } catch (e) {}
  document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
})();
</script>
<style>
:root { --ease:cubic-bezier(.2,.8,.2,1); }
html[data-theme=light] {
  color-scheme:light;
  --bg:#F3F6FA; --panel:#FFFFFF; --panel2:#EDF3F9; --line:#DBE5EF;
  --text:#17263B; --dim:#55708A; --faint:#8CA2B8;
  --ice:#0EA5D8; --ice-ink:#0A7FB4;
  --amber:#F0A41C; --amber-ink:#B06E00;
  --rose:#E2455E; --rose-ink:#C42844;
  --blind:#A9BDCE; --blind-ink:#6E8299;
  --ice-dim:rgba(14,165,216,.12); --amber-dim:rgba(240,164,28,.16);
  --rose-dim:rgba(226,69,94,.10); --blind-dim:rgba(84,104,124,.12);
  --chip-bg:rgba(23,38,59,.03); --shadow:0 1px 3px rgba(23,38,59,.05);
}
html[data-theme=dark] {
  color-scheme:dark;
  --bg:#0A0E14; --panel:#111823; --panel2:#151F2C; --line:#1F2B3A;
  --text:#E2ECF5; --dim:#93A7BA; --faint:#5A6E80;
  --ice:#6FD8FF; --ice-ink:#6FD8FF;
  --amber:#FFB454; --amber-ink:#FFB454;
  --rose:#FF5F6E; --rose-ink:#FF5F6E;
  --blind:#46586B; --blind-ink:#7C93A9;
  --ice-dim:rgba(111,216,255,.13); --amber-dim:rgba(255,180,84,.12);
  --rose-dim:rgba(255,95,110,.13); --blind-dim:rgba(90,110,128,.20);
  --chip-bg:rgba(255,255,255,.04); --shadow:none;
}
* { box-sizing:border-box; margin:0; padding:0; }
html { -webkit-text-size-adjust:100%; }
body {
  background:var(--bg); color:var(--text);
  font-family:system-ui,"PingFang SC","Noto Sans CJK SC","MiSans","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  transition:background-color .35s var(--ease), color .35s var(--ease);
}
.mono { font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace; font-size:.92em; }
.page { max-width:560px; margin:0 auto; padding:22px 18px 42px; }

/* theme crossfade on the surfaces that matter */
.verdict, .vs-side, .vs-badge, .vs-quiet, .chassis, .cell, .cell-detail-inner,
.group, .chip, .copy-btn, .theme-toggle {
  transition:background-color .35s var(--ease), border-color .35s var(--ease),
             color .35s var(--ease);
}

/* ---- header -------------------------------------------------- */
.top { display:flex; align-items:center; justify-content:space-between; gap:12px; opacity:0; }
body.revealed .top { animation:rise .5s var(--ease) .05s forwards; }
.brand { font-size:15px; font-weight:650; letter-spacing:.02em; flex:none; }
.brand em { font-style:normal; color:var(--ice-ink); }
.context { font-size:11px; color:var(--faint); text-align:right; line-height:1.5;
  flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.theme-toggle { position:relative; flex:none; width:46px; height:26px; border-radius:999px;
  border:1px solid var(--line); background:var(--panel2); cursor:pointer; padding:0;
  font-family:inherit; }
.theme-toggle:focus-visible { outline:2px solid var(--ice); outline-offset:2px; }
.theme-toggle .knob { position:absolute; top:2px; left:2px; width:20px; height:20px;
  border-radius:50%; background:var(--amber); display:flex; align-items:center;
  justify-content:center; font-size:11px; line-height:1; color:#FFFFFF;
  box-shadow:0 1px 2px rgba(0,0,0,.18);
  transition:transform .35s cubic-bezier(.34,1.45,.45,1), background-color .35s var(--ease); }
html[data-theme=dark] .theme-toggle .knob { transform:translateX(20px); background:var(--ice); }
.theme-toggle .knob .ic-sun { display:block; }
.theme-toggle .knob .ic-moon { display:none; font-size:10px; color:#083243; }
html[data-theme=dark] .theme-toggle .knob .ic-sun { display:none; }
html[data-theme=dark] .theme-toggle .knob .ic-moon { display:block; }

/* ---- verdict hero -------------------------------------------- */
.verdict { margin-top:22px; padding:20px 18px 18px; border:1px solid var(--line);
  border-radius:14px; background:var(--panel);
  box-shadow:var(--shadow);
  position:relative; overflow:hidden; opacity:0; }
body.revealed .verdict { animation:rise .55s var(--ease) .18s forwards; }
.verdict::before { content:""; position:absolute; inset:0 0 auto 0; height:3px;
  background:var(--state-accent,var(--blind)); }
.verdict[data-state=clean] { --state-accent:var(--ice); --state-ink:var(--ice-ink); }
.verdict[data-state=disguised] { --state-accent:var(--amber); --state-ink:var(--amber-ink); }
.verdict[data-state=disguised-by-prior] { --state-accent:var(--amber); --state-ink:var(--amber-ink); }
.verdict[data-state=component-mismatch] { --state-accent:var(--rose); --state-ink:var(--rose-ink); }
.verdict[data-state=semantics-broken] { --state-accent:var(--rose); --state-ink:var(--rose-ink); }
.verdict[data-state=semantics-deviating] { --state-accent:var(--amber); --state-ink:var(--amber-ink); }
.verdict[data-state=cannot-self-prove] { --state-accent:var(--blind); --state-ink:var(--blind-ink); }
.vword { font-size:32px; font-weight:700; letter-spacing:.01em; line-height:1.25;
  color:var(--state-ink,var(--text)); }
.vmeta { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.chip { display:inline-flex; align-items:center; gap:7px; padding:4px 11px;
  border:1px solid var(--line); border-radius:999px; font-size:11.5px; color:var(--dim);
  background:var(--chip-bg); white-space:nowrap; }
.chip .bars { display:inline-flex; gap:2.5px; align-items:flex-end; height:10px; }
.chip .bars i { width:3.5px; border-radius:1px; background:var(--blind); display:block; }
.chip .bars i:nth-child(1){ height:4px; } .chip .bars i:nth-child(2){ height:7px; }
.chip .bars i:nth-child(3){ height:10px; }
.chip[data-level=high] .bars i { background:var(--ice-ink); }
.chip[data-level=medium] .bars i:nth-child(-n+2) { background:var(--amber-ink); }
.chip[data-level=low] .bars i:nth-child(1) { background:var(--amber-ink); }
.chip .dot { width:7px; height:7px; border-radius:50%; background:var(--faint); }
.chip[data-tone=ice] .dot { background:var(--ice); }
.chip[data-tone=amber] .dot { background:var(--amber); }
.chip[data-tone=rose] .dot { background:var(--rose); }
.vconclusion { margin-top:13px; font-size:14.5px; line-height:1.75; color:var(--text); }
.vsub { margin-top:9px; font-size:11.5px; color:var(--faint); line-height:1.7; }
.vsub .nb { white-space:nowrap; }
.limited-flag { margin-top:9px; display:inline-block; padding:3px 9px; border-radius:6px;
  background:var(--amber-dim); color:var(--amber-ink); font-size:11px; }
.limited-flag[hidden] { display:none; }

/* ---- contradiction face-off ---------------------------------- */
.versus { margin-top:26px; opacity:0; }
body.revealed .versus { animation:rise .5s var(--ease) .5s forwards; }
.sec-label { font-size:12px; color:var(--dim); font-weight:600; margin-bottom:10px;
  display:flex; align-items:center; gap:8px; }
.sec-label::after { content:""; flex:1; height:1px; background:var(--line); }
.sec-count { color:var(--amber-ink); font-weight:700; }
.vs-card { display:grid; grid-template-columns:1fr 34px 1fr; align-items:stretch;
  margin-bottom:10px; }
.vs-side { border:1px solid var(--line); background:var(--panel); padding:11px 12px;
  border-radius:10px 0 0 10px; min-width:0; }
.vs-side.alt { border-radius:0 10px 10px 0; border-left:none; }
.vs-who { font-size:10.5px; color:var(--faint); margin-bottom:4px; }
.vs-say { font-size:13px; line-height:1.55; font-weight:600; }
.vs-side.says-missing .vs-say { color:var(--dim); }
.vs-side.says-present .vs-say { color:var(--ice-ink); }
.vs-badge { align-self:center; justify-self:center; width:26px; height:26px;
  border:1.5px solid var(--amber); border-radius:50%; color:var(--amber-ink);
  display:flex; align-items:center; justify-content:center; font-size:13px;
  font-weight:700; background:var(--panel);
  transform:scale(0); }
body.revealed .vs-badge { animation:pop .35s var(--ease) .7s forwards; }
.vs-side.left { opacity:0; transform:translateX(-14px); }
.vs-side.right { opacity:0; transform:translateX(14px); }
body.revealed .vs-side.left { animation:slide .45s var(--ease) .55s forwards; }
body.revealed .vs-side.right { animation:slide .45s var(--ease) .62s forwards; }
.vs-quiet { border:1px dashed var(--line); border-radius:10px; padding:11px 13px;
  color:var(--dim); font-size:12.5px; background:var(--panel); }

/* ---- dimension chassis --------------------------------------- */
.board { margin-top:26px; opacity:0; }
body.revealed .board { animation:rise .5s var(--ease) .72s forwards; }
.board-stats { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.stat { font-size:10.5px; padding:2.5px 8px; border-radius:999px; }
.stat.ice { background:var(--ice-dim); color:var(--ice-ink); }
.stat.amber { background:var(--amber-dim); color:var(--amber-ink); }
.stat.dim { background:var(--blind-dim); color:var(--dim); }
.chassis { display:grid; grid-template-columns:repeat(5,1fr); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.cell { appearance:none; border:none; background:var(--panel); color:var(--text);
  padding:9px 6px 8px; display:flex; flex-direction:column; align-items:flex-start; gap:5px;
  cursor:pointer; text-align:left; min-width:0; font-family:inherit;
  transition:background .25s var(--ease), box-shadow .25s var(--ease); }
.cell:focus-visible { outline:2px solid var(--ice); outline-offset:-2px; }
.cell.selected { background:var(--panel2); box-shadow:inset 0 -2px 0 var(--ice); }
.cell.filler { cursor:default; pointer-events:none; }
.cell-id { font-size:10px; font-weight:700; color:var(--faint); letter-spacing:.04em; }
.cell-lamp { width:14px; height:14px; border-radius:50%; border:1.5px solid var(--blind);
  background:var(--panel); transition:all .3s var(--ease); flex:none; }
.cell-name { font-size:11px; font-weight:600; line-height:1.3; }
.cell-sig { font-size:9.5px; color:var(--faint); line-height:1.3; }
.cell.pending { background:var(--panel); }
.cell.pending .cell-lamp { animation:pulse 1s ease-in-out infinite; }
.cell.pending .cell-name, .cell.pending .cell-sig { opacity:.25; }
.cell[data-signal=present] .cell-lamp,
.cell[data-signal=usable] .cell-lamp,
.cell[data-signal=consistent] .cell-lamp,
.cell[data-signal=enabled] .cell-lamp,
.cell[data-signal=match] .cell-lamp {
  border-color:var(--ice); background:radial-gradient(circle at 50% 50%, var(--ice) 0 45%, transparent 55%);
  box-shadow:0 0 6px rgba(14,165,216,.4); }
.cell[data-signal=present] .cell-sig, .cell[data-signal=usable] .cell-sig,
.cell[data-signal=consistent] .cell-sig, .cell[data-signal=enabled] .cell-sig,
.cell[data-signal=match] .cell-sig { color:var(--ice-ink); }
.cell[data-signal=divergent] .cell-lamp, .cell[data-signal=disabled] .cell-lamp,
.cell[data-signal=minor-deviations] .cell-lamp {
  border-color:var(--amber); background:radial-gradient(circle at 50% 50%, var(--amber) 0 45%, transparent 55%);
  box-shadow:0 0 6px rgba(240,164,28,.4); }
.cell[data-signal=divergent] .cell-sig, .cell[data-signal=disabled] .cell-sig,
.cell[data-signal=minor-deviations] .cell-sig { color:var(--amber-ink); }
.cell[data-signal=forged] .cell-lamp, .cell[data-signal=inconsistent] .cell-lamp {
  border-color:var(--rose); background:radial-gradient(circle at 50% 50%, var(--rose) 0 45%, transparent 55%);
  box-shadow:0 0 6px rgba(226,69,94,.35); }
.cell[data-signal=forged] .cell-sig, .cell[data-signal=inconsistent] .cell-sig { color:var(--rose-ink); }
.cell-detail { overflow:hidden; max-height:0; transition:max-height .35s var(--ease); }
.cell-detail.open { max-height:260px; }
.cell-detail-inner { margin-top:8px; border:1px solid var(--line); border-radius:10px;
  padding:12px 13px; background:var(--panel2); font-size:12px; }
.cell-detail-inner h4 { font-size:13px; margin-bottom:5px; color:var(--text); font-weight:650; }
.cell-detail-inner .note { color:var(--dim); line-height:1.6; margin-bottom:7px; }
.cell-detail-inner .obs { color:var(--faint); font-size:11px; line-height:1.65;
  word-break:break-all; }
.cell-detail-inner .obs b { color:var(--dim); font-weight:600; }

/* ---- check groups -------------------------------------------- */
.groups { margin-top:26px; opacity:0; }
body.revealed .groups { animation:rise .5s var(--ease) .88s forwards; }
.group { border:1px solid var(--line); border-radius:11px; background:var(--panel);
  margin-bottom:8px; overflow:hidden; }
.group-head { width:100%; display:flex; align-items:center; gap:10px; padding:11px 13px;
  background:none; border:none; color:var(--text); font-family:inherit; font-size:13px;
  cursor:pointer; text-align:left; }
.group-head:focus-visible { outline:2px solid var(--ice); outline-offset:-2px; }
.chev { width:16px; flex:none; text-align:center; color:var(--faint); font-size:11px;
  transition:transform .3s var(--ease); }
.group.open .chev { transform:rotate(90deg); }
.group-name { font-weight:650; }
.group-tallies { margin-left:auto; display:flex; gap:6px; font-size:10.5px; }
.tally { padding:2px 7px; border-radius:999px; }
.tally.ice { background:var(--ice-dim); color:var(--ice-ink); }
.tally.amber { background:var(--amber-dim); color:var(--amber-ink); }
.tally.rose { background:var(--rose-dim); color:var(--rose-ink); }
.tally.dim { background:var(--blind-dim); color:var(--dim); }
.group-body { display:none; padding:2px 13px 11px; }
.group.open .group-body { display:block; animation:rise .3s var(--ease); }
/* biometric completion of the signature chain */
.group-cta { margin:10px 13px 8px; padding:12px 13px; border:1px dashed var(--line);
  border-radius:11px; background:var(--panel2); display:flex; flex-direction:column; gap:10px; }
.group-cta .cta-text { font-size:12px; line-height:1.65; color:var(--dim); }
.cta-btn { align-self:flex-start; font:inherit; font-size:13px; font-weight:600;
  padding:8px 15px; border-radius:999px; border:1px solid var(--ice);
  background:var(--ice-dim); color:var(--ice-ink); cursor:pointer;
  transition:transform .16s var(--ease), box-shadow .16s var(--ease); }
.cta-btn:hover { box-shadow:var(--shadow); }
.cta-btn:active { transform:scale(.97); }
.cta-btn.waiting { opacity:.75; }
.cta-hint { font-size:11px; color:var(--faint); min-height:14px; }
.row { padding:8px 0; border-top:1px solid var(--line); cursor:pointer; }
.row-line { display:flex; gap:9px; align-items:center; min-width:0; }
.row-dot { width:7px; height:7px; border-radius:50%; flex:none; }
.row-dot.pass { background:var(--ice); }
.row-dot.warn { background:var(--amber); }
.row-dot.fail { background:var(--rose); }
.row-dot.info { background:var(--blind); }
.row-id { font-size:10.5px; color:var(--faint); width:34px; flex:none; font-weight:600; }
.row-obs { font-size:12px; color:var(--text); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; min-width:0; }
.row-extra { display:none; margin-top:6px; padding-left:16px; font-size:11px;
  color:var(--dim); line-height:1.7; }
.row.open .row-extra { display:block; }
.row-extra .k { color:var(--faint); }

/* ---- footer --------------------------------------------------- */
.report-foot { margin-top:26px; display:flex; flex-direction:column; gap:12px; opacity:0; }
body.revealed .report-foot { animation:rise .5s var(--ease) 1s forwards; }
.copy-btn { appearance:none; border:1px solid var(--ice-ink); color:var(--ice-ink);
  background:var(--panel); border-radius:999px; padding:11px 0; font-size:13.5px;
  font-weight:650; font-family:inherit; cursor:pointer; letter-spacing:.02em;
  transition:background .2s var(--ease), color .2s var(--ease); }
.copy-btn:active { background:var(--ice-dim); }
.copy-btn.done { background:var(--ice); color:#FFFFFF; border-color:var(--ice); }
.foot-meta { font-size:10.5px; color:var(--faint); line-height:1.8; text-align:center;
  word-break:break-all; }

/* ---- run overlay ---------------------------------------------- */
#runner { position:fixed; inset:0; z-index:20; background:var(--bg);
  display:flex; align-items:center; justify-content:center;
  transition:opacity .45s var(--ease);
  background-image:radial-gradient(58% 38% at 50% 42%, var(--ice-dim), transparent 75%);
  background-repeat:no-repeat; }
#runner.done { opacity:0; pointer-events:none; }
.run-inner { width:min(420px,80%); text-align:center; }
.run-brand { font-size:17px; font-weight:650; letter-spacing:.02em; }
.run-brand em { font-style:normal; color:var(--ice-ink); }
.run-word { margin-top:14px; font-size:21px; font-weight:650; }
.run-sub { margin-top:6px; font-size:12px; color:var(--faint); }
.run-track { margin-top:26px; height:6px; border-radius:999px; background:var(--panel2);
  border:1px solid var(--line); overflow:hidden; position:relative; }
.run-bar { height:100%; width:0%; border-radius:999px;
  background:linear-gradient(90deg, var(--ice-ink), var(--ice));
  transition:width .45s var(--ease); position:relative; }
.run-bar::after { content:""; position:absolute; inset:0;
  background:linear-gradient(100deg, transparent 20%, rgba(255,255,255,.5) 50%, transparent 80%);
  background-size:200% 100%; animation:sheen 1.3s linear infinite; }
.run-meta { margin-top:10px; display:flex; justify-content:space-between; align-items:baseline;
  font-size:11.5px; color:var(--dim); }
#runPct { font-weight:650; color:var(--ice-ink); font-variant-numeric:tabular-nums; }
@keyframes sheen { from { background-position:200% 0; } to { background-position:-100% 0; } }

/* ---- motion primitives --------------------------------------- */
@keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
@keyframes slide { to { opacity:1; transform:none; } }
@keyframes pop { 60% { transform:scale(1.25); } 100% { transform:scale(1); } }
@keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation:none !important; transition:none !important;
    opacity:1 !important; transform:none !important; }
}
</style>
</head>
<body>
<div id="runner">
  <div class="run-inner">
    <div class="run-brand">Soter<em>Checker</em></div>
    <div class="run-word">本地语义取证中</div>
    <div class="run-sub">13 项事务 · 三条签名链 · 15 维取证</div>
    <div class="run-track"><div class="run-bar" id="runBar"></div></div>
    <div class="run-meta"><span id="runStage">准备环境</span><span id="runPct">0%</span></div>
  </div>
</div>
<div class="page">
  <header class="top">
    <div class="brand">Soter<em>Checker</em></div>
    <div class="context" id="ctx"></div>
    <button class="theme-toggle" id="themeToggle" role="switch" aria-checked="false" aria-label="切换深色模式">
      <span class="knob"><span class="ic-sun">☀</span><span class="ic-moon">☾</span></span>
    </button>
  </header>

  <section class="verdict" id="verdict">
    <div class="vword" id="vword"></div>
    <div class="vmeta" id="vmeta"></div>
    <p class="vconclusion" id="vconclusion"></p>
    <div class="limited-flag" id="limitedFlag" hidden>应用列表能力受限：结论已按规则降级，未计入隐藏证据</div>
    <p class="vsub" id="vsub"></p>
  </section>

  <section class="versus" id="versus" hidden>
    <div class="sec-label">矛盾 · 证据对撞 <span class="sec-count" id="vsCount"></span></div>
    <div id="vsCards"></div>
  </section>

  <section class="board" id="board" hidden>
    <div class="sec-label">维度板 <span class="sec-count" id="boardTally"></span></div>
    <div class="board-stats" id="boardStats"></div>
    <div class="chassis" id="chassis"></div>
    <div class="cell-detail" id="cellDetail"><div class="cell-detail-inner" id="cellDetailInner"></div></div>
  </section>

  <section class="groups" id="groupsSection">
    <div class="sec-label">检查明细</div>
    <div id="groups"></div>
  </section>

  <footer class="report-foot">
    <button class="copy-btn" id="copyBtn">复制报告 JSON</button>
    <div class="foot-meta" id="footMeta"></div>
  </footer>
</div>

<script>
"use strict";

/* ============ vocabulary ============ */
var STATE_WORD = {
  "clean": "干净",
  "disguised": "检测到伪装",
  "disguised-by-prior": "按先验判定伪装",
  "component-mismatch": "组件与原厂不符",
  "semantics-broken": "语义断裂",
  "semantics-deviating": "语义有偏差",
  "cannot-self-prove": "无法自证"
};
var CONF_WORD = { "high": "高", "medium": "中", "low": "低" };
var SEM_WORD = {
  "consistent": "语义检查 一致",
  "correct": "语义检查 一致",
  "broken": "语义检查 断裂",
  "minor-deviations": "语义检查 有偏差",
  "inconsistent": "语义检查 断裂",
  "blinded-or-disabled": "语义检查 被遮",
  "blinded-by-hiding": "语义检查 被遮",
  "unknown": "语义检查 未判"
};
var PROFILE_WORD = {
  "match": "原厂样本 一致",
  "differs": "原厂样本 不一致",
  "unknown": "原厂样本 未读全"
};
var SIG_WORD = {
  "present": "在场", "usable": "可用", "consistent": "一致", "enabled": "启用",
  "match": "匹配", "blinded": "被遮", "blinded-or-disabled": "被遮/禁用",
  "unreadable": "不可读", "unknown": "未知", "informational": "记录",
  "weak": "弱证据", "limited": "受限", "divergent": "分歧", "forged": "伪造",
  "inconsistent": "断裂", "minor-deviations": "偏差", "absent": "未运行",
  "unavailable": "不可用", "disabled": "已冻结"
};
var SHORT_NAME = {
  "D1": "包视图", "D2": "组件绑定", "D3": "文件+哈希", "D4": "目录项",
  "D5": "固件属性", "D6": "遮罩配置", "D7": "启用态", "D8": "厂商包",
  "D9": "多 API", "D10": "布局文件", "D11": "样本比对", "D12": "事务语义",
  "D13": "能力自检", "D14": "跨层复核", "D15": "跨 uid"
};
var GROUP_WORD = {
  "env": "环境", "visibility": "可见性", "transactions": "事务语义",
  "crypto": "签名链", "sdk": "SDK 层", "reference": "原厂参照", "harness": "运行"
};
var GROUP_ORDER = ["visibility", "transactions", "crypto", "sdk", "reference", "env", "harness"];

/* contradiction token -> the two evidence channels and what each one reports */
function faceOff(token) {
  switch (token) {
    case "PM_hidden_while_stock_apk_present":
      return { a: ["包管理查询", "查无此包", "missing"], b: ["文件系统检查", "原厂路径上的 Soter 组件在位", "present"] };
    case "PM_reports_installed_but_apk_invisible":
      return { a: ["包管理查询", "这个包已安装", "present"], b: ["文件系统检查", "它的 APK 路径却不可见", "missing"] };
    case "component_unresolvable_while_package_present":
      return { a: ["包管理查询", "SoterService 包在位", "present"], b: ["组件解析查询", "服务组件解析不到", "missing"] };
    case "service_not_bindable":
      return { a: ["在位证据（文件系统 / 厂商包等）", "Soter 组件确实存在于本机", "present"], b: ["服务绑定", "bindService 失败，够不着它", "missing"] };
    case "component_not_enabled":
      return { a: ["启用状态查询", "enabled=false，被人为禁用", "missing"], b: ["原厂应有状态", "预装组件应为启用", "present"] };
    case "component_only_visible_with_disabled_flag":
      return { a: ["普通组件查询", "查不到组件", "missing"], b: ["带禁用标志的查询", "组件存在，只是被禁用", "present"] };
    case "layers_disagree_on_filesystem":
      return { a: ["本进程看到的世界", "文件不在", "missing"], b: ["独立进程看到的世界", "文件在", "present"] };
    case "bindable_but_dead_semantics":
      return { a: ["组件通道", "组件在位、已启用、可绑定", "present"], b: ["事务与签名应答", "全都不像一个活的 TA", "missing"] };
    case "semantics_deviate_from_reference":
      return { a: ["活 TA 参照线", "两家原厂样本的应答形状", "present"], b: ["实测应答", "存在少量偏差", "missing"] };
    case "per_uid_divergence":
      return { a: ["本应用（本 uid）", "被遮，看不见", "missing"], b: ["另一个应用（另一个 uid）", "看得见", "present"] };
    default:
      return { a: ["异常信号", token, "missing"], b: ["在位证据", "与该信号冲突", "present"] };
  }
}

/* ============ normalization ============ */
var REPORT = null;

function normalize(rep) {
  var v = rep.verdict || {};
  var n = {
    state: v.state || "cannot-self-prove",
    confidence: v.confidence || "low",
    conclusion: "",
    contradictions: [],
    semantics: v.semantics || "unknown",
    limited: !!v.visibility_limited,
    /* the plain run may end without a signature product; then the page can ask
       the host for one biometric signing round (see signatureCta) */
    pendingSignature: !!(rep.dump && rep.dump.pendingSignature),
    family: v.firmware_family_from_packages || "(unknown)",
    expected: !!v.soter_expected,
    profile: v.stock_profile || "",
    labelMatch: v.label_matches_observed_family !== false,
    dimensions: [],
    summary: rep.summary || {},
    pkg: (rep.app && rep.app.pkg) || "",
    uid: (rep.app && rep.app.uid) || "",
    checks: rep.checks || [],
    raw: rep
  };
  /* merged host report carries the richer verdict */
  if (rep.disguise) {
    var d = rep.disguise;
    n.state = d.verdict_state || n.state;
    n.confidence = d.confidence || n.confidence;
    n.conclusion = d.conclusion_zh || "";
    n.contradictions = d.contradictions || [];
    n.dimensions = d.dimensions || [];
    if (rep.app_report && rep.app_report.uid) n.uid = rep.app_report.uid;
    if (rep.verdict && rep.verdict.local_semantics) {
      var ls = rep.verdict.local_semantics;
      n.semantics = ls === "correct" ? "consistent"
          : ls === "broken" ? "inconsistent"
          : ls === "degraded" ? "minor-deviations" : ls;
    }
  } else {
    n.contradictions = v.contradictions || [];
    n.dimensions = v.dimensions || [];
  }
  if (!n.conclusion) n.conclusion = conclusionZh(n);
  /* merged host reports keep the tallies under app_report */
  if ((!n.summary.pass && !n.summary.fail && !n.summary.warn && !n.summary.info)
      && rep.app_report && rep.app_report.summary) {
    n.summary = rep.app_report.summary;
  }
  /* capability: judged by the check itself, whatever the report shape */
  for (var j = 0; j < n.checks.length; j++) {
    if (n.checks[j].id === "X13") {
      n.limited = n.checks[j].status !== "pass";
    }
    if (n.checks[j].id === "E1") {
      var obs = n.checks[j].observed || "";
      var mp = /(?:^| )pkg=([^ ]+)/.exec(obs);
      var mu = /(?:^| )uid=([^ ]+)/.exec(obs);
      var mm = /(?:^| )model=([^ ]+)/.exec(obs);
      if (mp) n.pkg = mp[1];
      if (mu && n.uid === "") n.uid = mu[1];
      if (mm) n.model = mm[1];
    }
    if (n.checks[j].id === "X3" && n.checks[j].status !== "pass") {
      /* path unreadable means "could not compare", not "component replaced" */
      n.profile = "unknown";
    }
  }
  return n;
}

function conclusionZh(n) {
  switch (n.state) {
    case "clean":
      return "原厂 Soter 组件在位且可用：路径可读、组件启用、可绑定，未见伪装。";
    case "disguised":
      return "组件确实在位，但本 uid 被展示成“没有 Soter”——是伪装正在生效，不是设备缺件。";
    case "disguised-by-prior":
      return "所有直接通道都看不到组件，而该固件（" + n.family + "，API 29+）出厂预置 SoterService：" +
             "按固件先验判定为伪装；无直接证据，置信度中等。";
    case "component-mismatch":
      return "组件在位，但与已采样的原厂特征不符——按被替换处理，不按正常设备处理。";
    case "semantics-broken":
      return "组件在位且可绑定，但事务与签名的应答全都不像一个活的 TA——不是伪装，是底层语义断了（TA 死掉或被换成了假的）。";
    case "semantics-deviating":
      return "组件可用、整体语义基本一致，但存在少量偏差。";
    default:
      return "本 uid 既看不到任何 Soter 组件，也找不到可比对的原厂布局：" +
             "无法把“被隐藏”与“本来就没有”区分开。" + (n.labelMatch ? "" : " 且自述厂商标识与 ROM 实际内容不符。");
  }
}

/* ============ run progress ============ */
var runTicks = 0;
var GROUP_STAGE = {
  "env": "环境", "visibility": "可见性取证", "transactions": "事务语义",
  "crypto": "签名链验证", "sdk": "SDK 判定", "reference": "原厂参照", "harness": "运行"
};
function setStage(label, frac) {
  document.getElementById("runStage").textContent = label;
  document.getElementById("runPct").textContent = Math.round(frac * 100) + "%";
  document.getElementById("runBar").style.width = (frac * 100) + "%";
}
window.checkTick = function (id, group) {
  runTicks++;
  var label = id === "bind" ? "绑定 Soter 服务"
      : (GROUP_STAGE[group] || "检查") + " · " + id;
  setStage(label, Math.min(0.97, runTicks / 44));
};
function finishRun() {
  setStage("生成判词", 1);
  setTimeout(function () {
    document.body.classList.add("revealed");
    var r = document.getElementById("runner");
    r.classList.add("done");
    setTimeout(function () { r.style.display = "none"; }, 520);
  }, 420);
}

/* ============ rendering ============ */
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function renderReport(json) {
  REPORT = json;
  var n = normalize(json);

  /* header context */
  var ctxParts = [];
  if (n.model) ctxParts.push(n.model);
  if (n.uid !== "") ctxParts.push("uid " + n.uid);
  document.getElementById("ctx").textContent = ctxParts.join(" · ");

  /* verdict */
  var verdict = document.getElementById("verdict");
  verdict.setAttribute("data-state", n.state);
  document.getElementById("vword").textContent = STATE_WORD[n.state] || n.state;

  var meta = document.getElementById("vmeta");
  meta.textContent = "";
  var conf = el("span", "chip");
  conf.setAttribute("data-level", n.confidence);
  var bars = el("span", "bars");
  bars.appendChild(el("i")); bars.appendChild(el("i")); bars.appendChild(el("i"));
  conf.appendChild(bars);
  conf.appendChild(document.createTextNode("判词置信度 " + (CONF_WORD[n.confidence] || n.confidence)));
  meta.appendChild(conf);
  var semTone = n.semantics === "consistent" ? "ice"
      : (n.semantics === "blinded-or-disabled" || n.semantics === "blinded-by-hiding" || n.semantics === "unknown") ? "" : "amber";
  var sem = el("span", "chip");
  if (semTone) sem.setAttribute("data-tone", semTone);
  sem.appendChild(el("span", "dot"));
  sem.appendChild(document.createTextNode(SEM_WORD[n.semantics] || n.semantics));
  meta.appendChild(sem);
  if (n.profile) {
    var prof = el("span", "chip");
    var profTone = n.profile === "match" ? "ice" : n.profile === "differs" ? "amber" : "";
    if (profTone) prof.setAttribute("data-tone", profTone);
    prof.appendChild(el("span", "dot"));
    prof.appendChild(document.createTextNode(PROFILE_WORD[n.profile] || ("原厂样本 " + n.profile)));
    meta.appendChild(prof);
  }
  if (n.expected) {
    var fam = el("span", "chip");
    fam.appendChild(el("span", "dot"));
    fam.appendChild(document.createTextNode("固件家族 " + n.family));
    meta.appendChild(fam);
  }

  document.getElementById("vconclusion").textContent = n.conclusion;
  document.getElementById("limitedFlag").hidden = !n.limited;
  var vsub = document.getElementById("vsub");
  vsub.textContent = "";
  var s = n.summary || {};
  vsub.appendChild(document.createTextNode("本次检查 "));
  vsub.appendChild(nb((s.pass || 0) + " 通过"));
  vsub.appendChild(document.createTextNode(" · "));
  vsub.appendChild(nb((s.fail || 0) + " 失败"));
  vsub.appendChild(document.createTextNode(" · "));
  vsub.appendChild(nb((s.warn || 0) + " 警告"));
  vsub.appendChild(document.createTextNode(" · "));
  vsub.appendChild(nb((s.info || 0) + " 记录"));
  if (!n.labelMatch) {
    vsub.appendChild(document.createTextNode("　—　自述标识与 ROM 内容不符"));
  }
  function nb(t) { var e = document.createElement("span"); e.className = "nb"; e.textContent = t; return e; }

  /* contradictions */
  var versus = document.getElementById("versus");
  var vsCards = document.getElementById("vsCards");
  vsCards.textContent = "";
  if (n.contradictions.length > 0) {
    versus.hidden = false;
    document.getElementById("vsCount").textContent = n.contradictions.length + " 项";
    n.contradictions.forEach(function (token) {
      var f = faceOff(token);
      var card = el("div", "vs-card");
      var A = el("div", "vs-side left says-" + f.a[2]);
      A.appendChild(el("div", "vs-who", f.a[0]));
      A.appendChild(el("div", "vs-say", f.a[1]));
      var B = el("div", "vs-side right alt says-" + f.b[2]);
      B.appendChild(el("div", "vs-who", f.b[0]));
      B.appendChild(el("div", "vs-say", f.b[1]));
      card.appendChild(A);
      card.appendChild(el("div", "vs-badge", "≠"));
      card.appendChild(B);
      vsCards.appendChild(card);
    });
  } else {
    versus.hidden = false;
    document.getElementById("vsCount").textContent = "0 项";
    vsCards.appendChild(el("div", "vs-quiet", "各观测面读数一致，未发现矛盾。"));
  }

  /* dimension board */
  var board = document.getElementById("board");
  var chassis = document.getElementById("chassis");
  chassis.textContent = "";
  if (n.dimensions.length > 0) {
    board.hidden = false;
    /* Dimensions whose answer is structurally out of reach for this vantage only
       ever show a dead cell; they stay in the report but not on the plate. */
    function deadDim(dim) {
      var sig = dim.signal || "unknown";
      if (dim.id === "D6") return sig === "unreadable" || sig === "unknown";
      if (dim.id === "D15") return sig === "unavailable" || sig === "unknown";
      return false;
    }
    var shown = n.dimensions.filter(function (d) { return !deadDim(d); });
    var tally = { ice: 0, amber: 0, dim: 0 };
    var cells = [];
    shown.forEach(function (dim, idx) {
      var sig = dim.signal || "unknown";
      if (["present","usable","consistent","enabled","match"].indexOf(sig) >= 0) tally.ice++;
      else if (["divergent","forged","inconsistent","minor-deviations","disabled"].indexOf(sig) >= 0) tally.amber++;
      else tally.dim++;
      var cell = el("button", "cell pending");
      cell.setAttribute("data-signal", sig);
      cell.appendChild(el("span", "cell-id", dim.id));
      cell.appendChild(el("span", "cell-lamp"));
      cell.appendChild(el("span", "cell-name", SHORT_NAME[dim.id] || dim.name || dim.id));
      cell.appendChild(el("span", "cell-sig", SIG_WORD[sig] || sig));
      cell.addEventListener("click", function () { showCellDetail(cell, dim); });
      chassis.appendChild(cell);
      cells.push(cell);
    });
    /* pad the last row so the chassis stays a continuous plate */
    var pad = (5 - (shown.length % 5)) % 5;
    for (var p = 0; p < pad; p++) {
      var filler = el("div", "cell filler");
      filler.setAttribute("aria-hidden", "true");
      chassis.appendChild(filler);
    }
    var stats = document.getElementById("boardStats");
    stats.textContent = "";
    if (tally.ice) stats.appendChild(el("span", "stat ice", tally.ice + " 在场"));
    if (tally.amber) stats.appendChild(el("span", "stat amber", tally.amber + " 异常"));
    if (tally.dim) stats.appendChild(el("span", "stat dim", tally.dim + " 被遮/未知"));
    document.getElementById("boardTally").textContent = shown.length + " 维";

    /* the one orchestrated moment: the chassis scans itself awake */
    var reduced = window.matchMedia
        && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    cells.forEach(function (cell, idx) {
      if (reduced) { cell.classList.remove("pending"); return; }
      setTimeout(function () { cell.classList.remove("pending"); }, 950 + idx * 55);
    });
  }

  /* check groups */
  var groupsRoot = document.getElementById("groups");
  groupsRoot.textContent = "";
  var byGroup = {};
  n.checks.forEach(function (c) {
    (byGroup[c.group] = byGroup[c.group] || []).push(c);
  });
  GROUP_ORDER.forEach(function (g) {
    var list = byGroup[g];
    var wantsCta = g === "crypto" && n.pendingSignature;
    if ((!list || !list.length) && !wantsCta) return;
    list = list || [];
    var t = { pass: 0, warn: 0, fail: 0, info: 0 };
    list.forEach(function (c) { t[c.status] = (t[c.status] || 0) + 1; });
    var box = el("div", "group");
    var head = el("button", "group-head");
    head.appendChild(el("span", "chev", "▸"));
    head.appendChild(el("span", "group-name", GROUP_WORD[g] || g));
    var tal = el("span", "group-tallies");
    if (t.pass) tal.appendChild(el("span", "tally ice", t.pass + " 通过"));
    if (t.fail) tal.appendChild(el("span", "tally rose", t.fail + " 失败"));
    if (t.warn) tal.appendChild(el("span", "tally amber", t.warn + " 警告"));
    if (t.info) tal.appendChild(el("span", "tally dim", t.info + " 记录"));
    head.appendChild(tal);
    var body = el("div", "group-body");
    list.forEach(function (c) {
      var row = el("div", "row");
      var line = el("div", "row-line");
      line.appendChild(el("span", "row-dot " + c.status));
      line.appendChild(el("span", "row-id", c.id));
      line.appendChild(el("span", "row-obs", c.observed || "(无读数)"));
      row.appendChild(line);
      var extra = el("div", "row-extra");
      if (c.expected) extra.appendChild(kv("期望", c.expected));
      if (c.evidence) extra.appendChild(kv("证据", c.evidence));
      row.appendChild(extra);
      row.addEventListener("click", function () { row.classList.toggle("open"); });
      body.appendChild(row);
    });
    head.addEventListener("click", function () { box.classList.toggle("open"); });
    box.appendChild(head);
    if (wantsCta) box.appendChild(signatureCta());
    box.appendChild(body);
    groupsRoot.appendChild(box);
  });

  /* footer: the run's own metadata, no product identifiers */
  var fm = [];
  if (REPORT.generated_at) {
    fm.push("生成于 " + new Date(REPORT.generated_at * 1000).toLocaleString("zh-CN", { hour12: false }));
  }
  document.getElementById("footMeta").textContent = fm.join(" · ");
  finishRun();
}

function kv(k, v) {
  var d = el("div");
  d.appendChild(el("span", "k", k + "："));
  d.appendChild(document.createTextNode(v));
  return d;
}

/* ============ biometric completion of the signature chain ============ */
function signatureCta() {
  var wrap = el("div", "group-cta");
  wrap.appendChild(el("div", "cta-text",
      "签名链还没走完：没有指纹时 finishSign 答 -26，依赖签名产物的 C 组检查因此跳过。"
      + "按一次真实指纹即可补全——宿主会自建一把一次性 AuthKey、弹出指纹，再用这次签名把整条链验完，随后自动刷新判词。"));
  var btn = el("button", "cta-btn");
  btn.id = "fpBtn";
  btn.type = "button";
  btn.textContent = "调用指纹补全签名链";
  btn.addEventListener("click", function () {
    if (typeof window.SoterChecker === "undefined" || !window.SoterChecker.requestFingerprint) {
      window.fingerprintState("unavailable");
      return;
    }
    window.fingerprintState("waiting");
    try {
      window.SoterChecker.requestFingerprint();
    } catch (e) {
      window.fingerprintState("failed");
    }
  });
  wrap.appendChild(btn);
  var hint = el("div", "cta-hint");
  hint.id = "fpHint";
  wrap.appendChild(hint);
  return wrap;
}

/* The host calls this while it drives the biometric round. */
window.fingerprintState = function (state) {
  var btn = document.getElementById("fpBtn");
  if (!btn) return;
  var hint = document.getElementById("fpHint");
  if (state === "waiting") {
    btn.disabled = true;
    btn.classList.add("waiting");
    btn.textContent = "等待指纹授权…（请按指纹）";
    if (hint) hint.textContent = "指纹对话框已弹出；不按也不影响其它检查。";
    return;
  }
  btn.disabled = false;
  btn.classList.remove("waiting");
  if (state === "unavailable") {
    btn.textContent = "调用指纹补全签名链";
    if (hint) hint.textContent = "当前宿主没有指纹桥（宿主预览里看不到这一步）。";
  } else {
    btn.textContent = "重试指纹授权";
    if (hint) hint.textContent = "上一次没有拿到匹配的指纹，可以再试一次。";
  }
};

function showCellDetail(cell, dim) {
  var detail = document.getElementById("cellDetail");
  var inner = document.getElementById("cellDetailInner");
  var was = cell.classList.contains("selected");
  Array.prototype.forEach.call(document.querySelectorAll(".cell.selected"),
      function (c) { c.classList.remove("selected"); });
  if (was) { detail.classList.remove("open"); return; }
  cell.classList.add("selected");
  inner.textContent = "";
  inner.appendChild(el("h4", null, dim.id + " · " + (dim.name || "")));
  if (dim.note) inner.appendChild(el("div", "note", dim.note));
  var obs = el("div", "obs");
  var b = el("b", null, "读数：");
  obs.appendChild(b);
  obs.appendChild(document.createTextNode(dim.observed || "（本维度由其它检查汇总，无独立读数）"));
  inner.appendChild(obs);
  detail.classList.add("open");
}

/* copy */
document.getElementById("copyBtn").addEventListener("click", function () {
  var btn = this;
  if (!REPORT) return;
  var text = JSON.stringify(REPORT, null, 2);
  function done() {
    btn.classList.add("done");
    btn.textContent = "已复制";
    setTimeout(function () { btn.classList.remove("done"); btn.textContent = "复制报告 JSON"; }, 1600);
  }
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    done();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, fallback);
  } else {
    fallback();
  }
});

/* theme toggle: software-layer only, persisted per page */
(function () {
  var btn = document.getElementById("themeToggle");
  function sync() {
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    btn.setAttribute("aria-checked", dark ? "true" : "false");
  }
  btn.addEventListener("click", function () {
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    var next = dark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("sotercheck-theme", next); } catch (e) {}
    sync();
  });
  sync();
})();

window.renderReport = renderReport;
</script>
</body>
</html>
