name: CI

on:
  push:
    branches: ["**"]
    tags: ["1.*", "v1.*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          test -n "$SDKMGR" || { echo "no sdkmanager under $SDK"; exit 1; }
          yes | "$SDKMGR" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMGR" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0"

      - name: Build the APK
        run: python3 build.py --out SoterChecker

      - name: Verify the manifest
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | tail -1)"
          "${BT}aapt2" dump badging build/SoterChecker-signed.apk | head -4

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: SoterChecker-apk
          path: build/*-signed.apk
          if-no-files-found: error
